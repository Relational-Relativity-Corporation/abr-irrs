[package]
name = "irrs-eval"
version = "0.1.0"
edition = "2021"
description = "Domain-independent pre-build declaration evaluator for IRRS. Accepts declarations via JSON file; identifies inputs, verifies prerequisites, produces a record for Origin review."

[[bin]]
name = "irrs-eval"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.10"
hex  = "0.4"
